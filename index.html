<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Game Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Board Game Prototype</h1>
    <div id="turn"></div>
    <ol id="phases" aria-label="Turn phases"></ol>
    <div class="controls">
      <button id="undo">Undo</button>
      <button id="next-phase" class="primary">Next</button>
      <button id="restart">Restart</button>
    </div>
  </header>

  <main>
    <div class="board-wrap">
      <svg id="board" aria-label="Main board" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <aside>
      <div class="side-top">
        <section class="panel" id="panel">
          <h2 id="panel-title"></h2>
          <div id="panel-body"></div>
          <div id="panel-actions" class="actions"></div>
        </section>
        <section class="panel synergy-panel">
          <h2>Synergy</h2>
          <svg id="synergy" viewBox="14 2 132 118" aria-label="Synergy circle"></svg>
        </section>
      </div>
      <div id="player-boards"></div>
    </aside>
  </main>

  <!-- Order matters: config and data first, then logic, then UI, then main. -->
  <script src="js/config.js"></script>
  <script src="js/data/weapons.js"></script>
  <script src="js/data/units.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/random.js"></script>
  <script src="js/rarity.js"></script>
  <script src="js/synergy.js"></script>
  <script src="js/board.js"></script>
  <script src="js/armory.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
