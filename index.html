<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Game Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Board Game Prototype</h1>
    <div id="turn"></div>
    <ol id="phases" aria-label="Turn phases"></ol>
    <div class="controls">
      <button id="undo">Undo</button>
      <button id="next-phase" class="primary">Next</button>
      <button id="restart">Restart</button>
    </div>
  </header>

  <main>
    <div class="board-wrap">
      <svg id="board" aria-label="Main board" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <aside>
      <section class="panel" id="panel">
        <h2 id="panel-title"></h2>
        <div id="panel-body"></div>
        <div id="panel-actions" class="actions"></div>
      </section>
      <section class="panel" id="market"></section>
      <div id="player-boards"></div>
    </aside>
  </main>

  <!-- Order matters: config, then the part classes the data uses, then data, then logic, UI and main. -->
  <script src="js/config.js"></script>
  <script src="js/random.js"></script>
  <script src="js/rarity.js"></script>
  <script src="js/synergy.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/data/weapons.js"></script>
  <script src="js/data/units.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/board.js"></script>
  <script src="js/units.js"></script>
  <script src="js/territory.js"></script>
  <script src="js/market.js"></script>
  <script src="js/armory.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
